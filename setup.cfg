[metadata]
name = knight_adventure
version = 1.0
description = Your description
long_description = A longer description
license = Your license here
classifiers =
    Programming Language :: Python :: 3

[options]
zip_safe = false
packages = find:
install_requires =
    click==8.*
    pygame==2.*
    structlog

[options.package_data]
knight_adventure.assets.gfx = *.png
knight_adventure.assets.levels = *.json

[options.entry_points]
# Optional, but if you want to keep it,
# make sure you have a function called
# main() in tower.main!
console_scripts =
    knight_adventure = knight_adventure.main:main